name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore "src/Hangfire.Dashboard/Hangfire.Dashboard.slnx"
      - name: Build
        run: dotnet build "src/Hangfire.Dashboard/Hangfire.Dashboard.slnx" -c Release --no-restore
      - name: Test
        run: dotnet test tests/Hangfire.Dashboard.Tests/Hangfire.Dashboard.Tests.csproj -c Release
